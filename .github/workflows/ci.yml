name: Continuous Integration
on:
  push:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Tools
      run: |
        pip install --upgrade pip
        # Yahan hum black aur baqi tools server par install kar rahe hain taake error na aaye
        pip install black skops pandas numpy scikit-learn matplotlib joblib

    - name: Format Code
      run: make format

    - name: Train Model
      run: make train

    - name: Evaluate Model
      run: |
        echo "## Model Metrics" > report.md
        cat Results/metrics.txt >> report.md
        echo "" >> report.md
        echo "## Confusion Matrix Plot" >> report.md
        echo "![Confusion Matrix](Results/model_results.png)" >> report.md
        cat report.md >> $GITHUB_STEP_SUMMARY

    - name: Update Branch
      env:
        NAME: ${{ secrets.USER_NAME }}
        EMAIL: ${{ secrets.USER_EMAIL }}
      run: |
        make update-branch USER_NAME="$NAME" USER_EMAIL="$EMAIL"
