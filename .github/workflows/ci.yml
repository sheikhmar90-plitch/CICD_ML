name: Model Training and Deployment

on:
  push:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: make install

    - name: Format Code
      run: make format

    - name: Train Model
      run: make train

    - name: Evaluate Model
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Humne setup-cml step nikal diya hai taake crash na ho
        # Aur direct node package ke zariye comment create kar rahe hain
        npm install -g @dvcorg/cml
        make eval

    - name: Update Branch
      env:
        NAME: ${{ secrets.USER_NAME }}
        EMAIL: ${{ secrets.USER_EMAIL }}
      run: |
        make update-branch USER_NAME="$NAME" USER_EMAIL="$EMAIL"

    - name: Push to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git config --global user.name "CI Bot"
        git config --global user.email "bot@example.com"
        git remote add hf https://huggingface.co{{ secrets.USER_NAME }}/update-branch
        git push --force hf update:main
