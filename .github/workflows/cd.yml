name: Continuous Deployment
on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Humne condition wali line bilkul saaf kar di hai taake skip na ho
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Deployment To Hugging Face
        env:
          HF: ${{ secrets.HF_TOKEN }}
        run: make deploy HF=$HF
