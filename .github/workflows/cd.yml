name: Continuous Deployment
on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Hugging Face Tool
        run: |
          pip install --upgrade pip
          pip install huggingface-hub

      - name: Deployment To Hugging Face
        env:
          HF: ${{ secrets.HF_TOKEN }}
        run: |
          git pull origin update || true
          hf auth login --token $HF
          
          # Humne namespace ka jhanjhat khatam karke direct repo-id 'my-model-app' set kar di hai
          hf upload my-model-app ./App . --repo-type=space --commit-message="Sync App files"
          hf upload my-model-app ./Model ./Model --repo-type=space --commit-message="Sync Model"
          hf upload my-model-app ./Results ./Metrics --repo-type=space --commit-message="Sync Metrics"
